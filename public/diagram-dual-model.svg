<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    .arrow-path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
    .arrow-blue { stroke: rgba(0, 85, 255, 0.35); }
    .arrow-green { stroke: rgba(0, 200, 83, 0.35); }
    .arrowhead-blue { fill: none; stroke: rgba(0, 85, 255, 0.35); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
    .arrowhead-green { fill: none; stroke: rgba(0, 200, 83, 0.35); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
    .motion-route { fill: none; opacity: 0; pointer-events: none; }
    .spark-pill-blue { fill: #0055ff; opacity: 0.4; }
    .spark-pill-green { fill: #00c853; opacity: 0.4; }
    .node-box { fill: #ffffff; stroke: #d0d5e6; stroke-width: 1.4; }
    .node-fe { stroke: #b8ccf5; }
    .node-bg { stroke: #a8d4bc; }
    .node-title { font-family: 'Syne', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0a0f1c; text-anchor: middle; }
    .node-title-sm { font-family: 'Syne', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0a0f1c; text-anchor: middle; }
    .node-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #848ba8; text-anchor: middle; }
    .node-sub-sm { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #848ba8; text-anchor: middle; }
    .label-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #4a5178; text-transform: uppercase; letter-spacing: 0.06em; }
    .realtime-border { fill: none; stroke: #c0c6d8; stroke-width: 1.4; stroke-dasharray: 6,4; }
    .realtime-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #848ba8; text-transform: uppercase; letter-spacing: 0.08em; }
  </style>

  <rect x="55" y="218" width="340" height="228" rx="14" class="realtime-border"/>
  <text x="225" y="440" text-anchor="middle" class="realtime-label">real-time</text>

  <path d="M 150 358 V 298 Q 150 264 180 264 H 228" class="arrow-path arrow-blue"/>
  <path d="M 218 254 L 230 264 L 218 274" class="arrowhead-blue"/>
  <path d="M 303 292 V 368 Q 303 388 275 388 H 225" class="arrow-path arrow-blue"/>
  <path d="M 235 378 L 223 388 L 235 398" class="arrowhead-blue"/>

  <path d="M 303 228 V 158 Q 303 118 430 118 H 438" class="arrow-path arrow-green"/>
  <path d="M 428 108 L 440 118 L 428 128" class="arrowhead-green"/>
  <path d="M 303 228 V 143 Q 303 108 510 108 H 518" class="arrow-path arrow-green"/>
  <path d="M 508 98 L 520 108 L 508 118" class="arrowhead-green"/>

  <path d="M 482 142 V 210 Q 482 248 440 248 H 383" class="arrow-path arrow-green"/>
  <path d="M 395 238 L 383 248 L 395 258" class="arrowhead-green"/>
  <path d="M 558 142 V 230 Q 558 268 460 268 H 383" class="arrow-path arrow-green"/>
  <path d="M 395 258 L 383 268 L 395 278" class="arrowhead-green"/>

  <path d="M 558 88 V 43 Q 558 23 583 23 H 630 Q 650 23 650 43 V 103 Q 650 118 630 118 H 588" class="arrow-path arrow-green"/>
  <path d="M 600 108 L 588 118 L 600 128" class="arrowhead-green"/>

  <path id="wt-rt-loop" d="M 150 358 V 298 Q 150 264 180 264 H 228 L 303 264 V 292 V 368 Q 303 388 275 388 H 225 L 150 388 V 358" class="motion-route"/>
  <path id="wt-bg-loop" d="M 303 228 V 143 Q 303 108 510 108 H 518 L 558 108 V 88 V 43 Q 558 23 583 23 H 630 Q 650 23 650 43 V 103 Q 650 118 630 118 H 588 L 558 118 V 142 V 230 Q 558 268 460 268 H 383 L 303 268 V 228" class="motion-route"/>

  <g>
    <rect class="spark-pill-blue" x="-12" y="-3" width="24" height="6" rx="3"/>
    <animateMotion dur="1.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wt-rt-loop"/>
    </animateMotion>
  </g>
  <g>
    <rect class="spark-pill-blue" x="-12" y="-3" width="24" height="6" rx="3"/>
    <animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wt-rt-loop"/>
    </animateMotion>
  </g>
  <g>
    <rect class="spark-pill-green" x="-12" y="-3" width="24" height="6" rx="3"/>
    <animateMotion dur="4.2s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wt-bg-loop"/>
    </animateMotion>
  </g>

  <rect x="78" y="360" width="145" height="56" rx="10" class="node-box"/>
  <text x="150" y="393" class="node-title">user</text>

  <rect x="230" y="232" width="145" height="72" rx="10" class="node-box node-fe"/>
  <text x="303" y="256" class="node-title">Front-end model</text>
  <text x="303" y="274" class="node-sub">
    <tspan x="303" dy="0">Gemini Live</tspan>
    <tspan x="303" dy="11">OpenAI Realtime</tspan>
  </text>

  <rect x="448" y="90" width="72" height="52" rx="10" class="node-box node-bg"/>
  <text x="484" y="110" class="node-title-sm">Background brain</text>
  <text x="484" y="124" class="node-sub-sm">Gemini 3.5 Flash</text>

  <rect x="528" y="90" width="72" height="52" rx="10" class="node-box node-bg"/>
  <text x="564" y="110" class="node-title-sm">Background brain</text>
  <text x="564" y="124" class="node-sub-sm">Gemini 3.5 Flash</text>

  <text x="375" y="110" class="label-text" text-anchor="middle">task</text>
  <text x="430" y="266" class="label-text" text-anchor="middle">result</text>
  <text x="665" y="40" class="label-text">tool calls</text>
  <text x="665" y="56" class="label-text">search</text>
  <text x="665" y="72" class="label-text" style="text-transform: none; font-style: italic;">generative UI</text>
</svg>
